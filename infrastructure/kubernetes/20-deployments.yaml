apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecom
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: ecom/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: DATABASE_URL, value: "postgresql://postgres:00000000@postgres.ecom.svc.cluster.local:5432/app" }
            - { name: REDIS_URL, value: "redis://redis.ecom.svc.cluster.local:6379" }
            - { name: ORDER_SERVICE_URL, value: "http://order-service.ecom.svc.cluster.local:3000" }
            - { name: INVENTORY_SERVICE_URL, value: "http://inventory-service.ecom.svc.cluster.local:3001" }
            - { name: SHIPPING_SERVICE_URL, value: "http://shipping-service.ecom.svc.cluster.local:3002" }
            - { name: PAYMENT_SERVICE_URL, value: "http://payment-service.ecom.svc.cluster.local:3003" }
            - { name: NOTIFICATION_SERVICE_URL, value: "http://notification-service.ecom.svc.cluster.local:3004" }
            - { name: CART_SERVICE_URL, value: "http://cart-service.ecom.svc.cluster.local:3005" }
            - name: JWT_ACCESS_SECRET
              valueFrom: { secretKeyRef: { name: ecom-secrets, key: jwt-access-secret } }
            - name: JWT_REFRESH_SECRET
              valueFrom: { secretKeyRef: { name: ecom-secrets, key: jwt-refresh-secret } }
            - name: JWT_INTERNAL_SECRET
              valueFrom: { secretKeyRef: { name: ecom-secrets, key: jwt-internal-secret } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
