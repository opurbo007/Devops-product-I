# One Deployment per app. Images come from the Dockerfiles
# (docker build -f <svc>/src/Dockerfile . && push to your registry).
# Shared env is inlined per service for clarity; production should move
# secrets to SealedSecrets/external-secrets (see 01-secrets.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecom
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: ecom/order-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: PORT, value: "3000" }
            - { name: DATABASE_URL, value: "postgresql://postgres:00000000@postgres.ecom.svc.cluster.local:5432/app" }
            - { name: KAFKA_BROKERS, value: "kafka.ecom.svc.cluster.local:29092" }
            - name: JWT_INTERNAL_SECRET
              valueFrom: { secretKeyRef: { name: ecom-secrets, key: jwt-internal-secret } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecom
spec:
  replicas: 2
  selector:
    matchLabels: { app: inventory-service }
  template:
    metadata:
      labels: { app: inventory-service }
    spec:
      containers:
        - name: inventory-service
          image: ecom/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          env:
            - { name: PORT, value: "3001" }
            - { name: DATABASE_URL, value: "postgresql://postgres:00000000@postgres.ecom.svc.cluster.local:5432/inventory" }
            - { name: KAFKA_BROKERS, value: "kafka.ecom.svc.cluster.local:29092" }
            - { name: UPLOAD_DIR, value: "/app/uploads" }
            - name: JWT_INTERNAL_SECRET
              valueFrom: { secretKeyRef: { name: ecom-secrets, key: jwt-internal-secret } }
          volumeMounts:
            - { name: inventory-uploads, mountPath: /app/uploads }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
      volumes:
        - name: inventory-uploads
          emptyDir: {}
          # Production: replace emptyDir with a PVC (ReadWriteMany) or move
          # to S3/MinIO + presigned URLs — local disk does not scale past 1 replica.
---
